name: Monitor official sources

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# Serialize runs so a manual dispatch cannot race the scheduled run and create a
# second issue between the exact-key search and issue creation.
concurrency:
  group: crew-customs-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Restore monitor state
        id: monitor-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .crew-customs-monitor
          key: monitor-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            monitor-state-${{ runner.os }}-
      - name: Install project
        run: python -m pip install .
      - name: Draft source review issues
        run: crew-customs monitor --root .
      - name: Create or update exact-key review issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          drafts=.crew-customs-monitor/issues.json
          open_issues="$RUNNER_TEMP/open-source-change-issues.json"
          body_file="$RUNNER_TEMP/source-change-issue.md"

          # Ensure fresh repositories can apply the required label.  Existing
          # labels are deliberately left untouched.
          gh label create source-change --color 0E8A16 2>/dev/null || true
          gh issue list --state open --label source-change --limit 1000 \
            --json number,body > "$open_issues"

          jq -c '.[]' "$drafts" | while IFS= read -r draft; do
            key="$(jq -r '.key' <<< "$draft")"
            title="$(jq -r '.title' <<< "$draft")"
            jq -r '.body' <<< "$draft" > "$body_file"

            # The marker includes the whole stable monitor key, so same-source
            # changes with different fingerprints remain distinct issues.
            marker="Monitoring key: \`$key\`"
            number="$(jq -r --arg marker "$marker" \
              '[.[] | select((.body // "") | contains($marker)) | .number] \
              | sort | first // empty' "$open_issues")"
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file "$body_file"
            else
              gh issue create --title "$title" --label source-change --body-file "$body_file"
            fi
          done
      - name: Save monitor state
        if: success()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .crew-customs-monitor
          key: ${{ steps.monitor-cache.outputs.cache-primary-key }}

  cashDeclaration:
    rules:
      - text: >-
          Funds of USD 10,000 or more (or equivalent) must be declared to Customs.
        sourceIds:
          - kr-kcs-passengers
  alcohol:
    rules:
      - text: >-
          Adults (19+) may bring in alcohol up to a total of 2 litres and a value
          of USD 400. No exemption for travellers under 19.
        sourceIds:
          - kr-kcs-passengers
  tobacco:
    rules:
      - text: >-
          Adults (19+) may bring in 200 cigarettes (or e-cigarette liquid up to
          20 ml). No exemption for travellers under 19.
        sourceIds:
          - kr-kcs-passengers

iso2: US
countryName: United States
customs:
  foodAndAgriculture: []
  medicines: []
  cashDeclaration:
    rules:
      - text: >-
          Currency or monetary instruments of USD 10,000 or more (or the foreign
          equivalent) carried into or out of the United States must be reported
          to CBP (FinCEN Form 105).
        sourceIds:
          - us-cbp-duty-exemptions
  alcohol:
    rules:
      - text: >-
          Travellers aged 21 or over may include one US litre (33.8 fl oz) of
          alcoholic beverages in the personal exemption, for personal use.
        sourceIds:
          - us-cbp-duty-exemptions
  tobacco:
    rules:
      - text: >-
          The personal exemption includes up to 200 cigarettes and 100 cigars
          when arriving from a non-beneficiary country.
        sourceIds:
          - us-cbp-duty-exemptions
  prohibitedItems: []
  restrictedItems: []
  declarationRequirements:
    - text: >-
        The standard duty-free personal exemption for returning US residents is
        USD 800; visiting non-residents receive a smaller exemption. Goods above
        the exemption must be declared to CBP.
      sourceIds:
        - us-cbp-duty-exemptions

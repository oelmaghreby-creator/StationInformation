iso2: CZ
countryName: Czech Republic
customs:
  foodAndAgriculture: []
  medicines: []
  cashDeclaration:
    rules:
      - text: >-
          Travellers entering or leaving the EU carrying EUR 10,000 or more (or
          the equivalent in another currency) must declare it to customs.
        sourceIds:
          - eu-youreurope-allowances
  alcohol:
    rules:
      - text: >-
          Arriving from outside the EU, the allowance is 4 litres of still wine
          and 16 litres of beer, plus one of: 1 litre of spirits over 22% vol,
          1 litre of undenatured ethyl alcohol 80% vol or higher, or 2 litres of
          fortified or sparkling wine. Some member states apply lower limits.
        sourceIds:
          - eu-youreurope-allowances
  tobacco:
    rules:
      - text: >-
          Arriving from outside the EU, the allowance is 200 cigarettes, or 100
          cigarillos, or 50 cigars, or 250g of tobacco. Some member states apply
          lower limits (e.g. 40 cigarettes).
        sourceIds:
          - eu-youreurope-allowances
  prohibitedItems: []
  restrictedItems: []
  declarationRequirements:
    - text: >-
        For air travellers arriving from outside the EU, goods (other than the
        tobacco and alcohol allowances) up to EUR 430 in value are free of duty
        and tax; above that, goods must be declared.
      sourceIds:
        - eu-youreurope-allowances

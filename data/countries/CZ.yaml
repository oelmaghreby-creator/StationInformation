crewNotes:
  - text: >-
      These are the EU-wide traveller allowances for arrivals from outside the
      EU. Individual member states may set lower limits or reduce allowances for
      operating crew, so confirm the Czechia national rule. Compiled from the
      cited EU guidance and pending final authority review.
    sourceIds:
      - eu-youreurope-allowances

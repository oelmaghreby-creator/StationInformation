  tobacco: {}
  prohibitedItems:
    - text: >-
          Alcohol and alcoholic beverages are strictly prohibited in Saudi
          Arabia and must not be brought in under any circumstances. Pork
          products and materials contrary to Islamic values are also prohibited.
      sourceIds:
        - sa-zatca-traveller-luggage
  restrictedItems: []
  declarationRequirements:
    - text: >-
        Personal luggage and gifts of a personal, non-commercial nature up to a
        total value of SAR 3,000 are admitted duty-free; higher-value or
        commercial goods must be declared.
      sourceIds:
        - sa-zatca-traveller-luggage

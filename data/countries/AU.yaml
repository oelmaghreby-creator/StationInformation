crewNotes:
  - text: >-
      The crew-member duty-free limit for general goods is AUD450. General goods
      include gifts, souvenirs, cameras, electronics, leather goods, perfume
      concentrates, jewellery, watches and sporting equipment; the concession
      does not apply to commercial goods.

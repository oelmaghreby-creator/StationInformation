iso2: ID
countryName: Indonesia
customs:
  foodAndAgriculture: []
  medicines: []
  cashDeclaration:
    rules:
      - text: >-
          Cash or equivalent of IDR 100,000,000 or more (or the foreign-currency
          equivalent) must be declared on arrival or departure.
        sourceIds:
          - id-beacukai-passenger
  alcohol:
    rules:
      - text: >-
          Passengers aged 21 or over may bring in a maximum of 1 litre of
          alcoholic beverage.
        sourceIds:
          - id-beacukai-passenger
  tobacco:
    rules:
      - text: >-
          Passenger allowance is up to 200 cigarettes, or 25 cigars, or 100g of
          loose tobacco (with separate limits for e-cigarettes/e-liquid).
        sourceIds:
          - id-beacukai-passenger
  prohibitedItems: []
  restrictedItems: []
  declarationRequirements:
    - text: >-
        Personal goods up to USD 500 FOB per person per arrival are exempt;
        above that, 10% import duty plus taxes apply.
      sourceIds:
        - id-beacukai-passenger
